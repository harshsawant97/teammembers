name: smart_attendance_app
description: AI-powered Smart Attendance Mobile App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.1
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.8.0
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  go_router: ^13.2.0
  shared_preferences: ^2.2.2
  workmanager: ^0.5.2
  image: ^4.1.4
  cached_network_image: ^3.3.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
